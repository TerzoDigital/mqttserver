# set up persistence
persistence true
persistence_location /mosquitto/data/

# Disable anonymous access
allow_anonymous false

# Use password authentication
password_file /mosquitto/config/passwd_file

# Default listener (non-TLS) on port 1883
listener 1883

# TLS listener on port 8883
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Require clients to present valid certs signed by our CA
#require_certificate true
#use_identity_as_username false # set true if you want CN from cert to act as username

# Optional: only allow TLS 1.2 or higher
tls_version tlsv1.2

# Logging
log_timestamp false
# log_dest file /mosquitto/log/mosquitto.log # only logging to stdout and using docker logging facilities to persist
log_dest stdout
log_type all
# Although we are logging all messages given the line above other choices are available
# Try commenting the "log_type all" line and uncommenting one or more of the following 4 lines to control log size
# log_type error
# log_type warning
# log_type notice
# log_type information
# connection_messages true
# Note that the biggest saving may come from "connection_messages false" as clients that reconnect often generate
# lots of log lines. Leaving debug off will stop PING request and responses being recorded in the logs
